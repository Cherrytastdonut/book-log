<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.title} + ' - 코노 디오의 독서기록소'">상세 보기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --book-crimson: #5d0e0e;
            --page-antique: #f4eee0;
            --jojo-gold: #c5a059;
            --ink-black: #1a1a1b;
        }

        body {
            background: radial-gradient(circle at center, #3d332d 0%, #0a0908 100%); 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto; 
            perspective: 3000px; 
            margin: 0;
            font-family: 'Times New Roman', serif;
            min-width: 320px; 
        }

        .book-container {
            width: 90vw;
            max-width: 1200px;
            min-height: 550px; 
            min-width: 300px;
            aspect-ratio: 1.4 / 1; 
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform: translateX(-25%) rotateY(-20deg) rotateX(5deg); 
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.8));
        }

        .book-container.opened {
            transform: translateX(0) rotateY(0deg) rotateX(0deg);
        }

        .page {
            position: absolute;
            background: var(--page-antique);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.1);
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* 🧛 오른쪽 페이지 (이미지 뷰어) */
        .page-right { 
            left: 50%; 
            width: 50%;
            height: 100%;
            top: 0;
            border-radius: 0 15px 15px 0; 
            z-index: 1; 
            border: 1px solid #dcd3bc;
            border-left: 2px solid #ccc; 
        }

        .cover-wrapper {
            position: absolute;
            width: 50%;
            height: 100%;
            left: 50%;
            top: 0;
            transform-origin: left;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 5;
        }

        .book-container.opened .cover-wrapper { 
            transform: rotateY(-180deg); 
        }

        .cover-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #7a1515, var(--book-crimson));
            color: var(--jojo-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0 15px 15px 0; 
            backface-visibility: hidden;
            border: 10px double var(--jojo-gold);
            box-sizing: border-box;
            z-index: 2;
        }

        /* 🧛 표지 뒷면 (왼쪽 페이지 - 텍스트 뷰어) */
        .cover-back {
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotateY(180deg); 
            backface-visibility: hidden;
            border-radius: 15px 0 0 15px !important; 
            border-left: 1px solid #dcd3bc !important; 
            border-right: 5px solid #222 !important; 
            z-index: 1;
        }

        .record-scroll { overflow-y: auto; flex-grow: 1; max-height: 100%; padding-right: 10px; }
        .record-scroll::-webkit-scrollbar { width: 6px; }
        .record-scroll::-webkit-scrollbar-thumb { background: var(--jojo-gold); border-radius: 10px; }

        /* 🧛 뷰어 전용 스타일! */
        /* 🧛 write.html과 동일한 제왕의 제목 스타일이다아앗!!! */
        .jojo-title-display {
            font-size: 1.5rem !important;
            font-weight: bold !important;
            letter-spacing: 2px;
            border: 2px double var(--jojo-gold) !important; /* 이중 테두리의 관록! */
            color: var(--book-crimson) !important;
            padding: 15px !important;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            margin-bottom: 20px;
            display: block;
            word-break: keep-all;
        }

        /* 🧛 본문 내용 또한 입력창과 동일한 두께와 크기로 맞춘다! */
        .content-text {
            font-size: 1rem !important; /* 일반 input/textarea 크기 */
            line-height: 1.8;
            font-weight: normal; /* 입력창 기본 두께 */
            white-space: pre-wrap;
            color: var(--ink-black);
            word-break: break-all;
            padding: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        .content-img {
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 2px solid var(--jojo-gold);
        }

        /* 🧛 [추가] 스크롤 유도 파문 문구 스타일! */
        .scroll-hint {
            font-size: 0.8rem;
            color: #6c757d;
            font-style: italic;
            margin-bottom: 15px;
            text-align: right;
            border-right: 3px solid var(--jojo-gold);
            padding-right: 8px;
        }

        .jojo-btn {
            background: var(--book-crimson);
            color: var(--jojo-gold);
            font-weight: bold;
            border: 1px solid var(--jojo-gold);
            padding: 10px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            text-transform: uppercase;
            transition: 0.4s;
            cursor: pointer;
        }
        .jojo-btn:hover { background: #4a0a0a; color: #fff; box-shadow: 0 0 15px rgba(197, 160, 89, 0.4); }

        h2.title-text { font-size: clamp(1.4rem, 4vw, 2.2rem); color: var(--ink-black); text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        h3 { font-size: clamp(1.2rem, 3vw, 1.8rem) !important; }

        /* 📱 모바일 환경 최적화 */
        /* 📱 모바일 환경 최적화 */
        @media (max-width: 668px) {
            .jojo-title-display {
                font-size: 1.2rem !important;
                padding: 10px !important;
            }
            .book-container {
                width: 90vw; height: 90vh; aspect-ratio: auto; 
                transform: translateY(-25%) rotateX(15deg) !important; 
            }
            .book-container.opened { transform: translateY(0) rotateX(0deg) !important; }
            .page { padding: 1rem 1.5rem !important; }
            
            .page-right { 
                left: 0; top: 50%; width: 100%; height: 50%;
                border-radius: 0 0 15px 15px !important; 
                border-left: 1px solid #dcd3bc !important;
                border-top: 2px solid #ccc !important; 
            }
            
            .cover-wrapper { left: 0; top: 50%; width: 100%; height: 50%; transform-origin: top; }
            .book-container.opened .cover-wrapper { transform: rotateX(180deg) !important; }
            .cover-front { border-radius: 0 0 15px 15px !important; }
            .cover-back {
                transform: rotateX(180deg) !important; 
                border-radius: 15px 15px 0 0 !important; 
                border-bottom: 3px solid #222 !important; 
                border-top: 1px solid #dcd3bc !important; 
                border-left: none !important; border-right: none !important;
            }
            h3 { font-size: 1.1rem !important; margin-bottom: 10px !important; padding-bottom: 5px !important; }
/* 🧛 본문 내용의 두께를 쌈@뽕하게 조절했다아앗!!! */
            .content-text {
                        font-size: 1rem !important;
                        line-height: 1.8;
                        
                        /* 🧛 바로 여기다앗!! 기본 400이나 normal보다 묵직한 500(Medium)이나 600을 추천한다! */
                        /* 자네가 원하는 쫀득한 두께감에 맞춰 500~600 사이를 선택하라구!! */
                        font-weight: 500 !important; 
                        
                        white-space: pre-wrap;
                        color: var(--ink-black);
                        word-break: break-all;
                        padding: 15px; /* 여백도 조금 더 줘서 가독성을 높였다앗! */
                        background: rgba(255, 255, 255, 0.4); /* 배경을 살짝 더 밝게 해서 글자를 돋보이게!! */
                        border-radius: 8px;
                        border: 1px solid rgba(197, 160, 89, 0.3);
                    }            .jojo-btn { padding: 8px; font-size: 0.8rem; }
            .scroll-hint { font-size: 0.7rem; margin-bottom: 10px; } /* 모바일에선 더 작게 */
        }
    </style>
</head>
<body>

<div class="book-container" id="jojoBook">
    
    <div class="page page-right">
        <h3 class="fw-bold border-bottom pb-2 mb-2" style="color: #443e33; font-style: italic; border-color: var(--jojo-gold) !important;">VISUAL CHRONICLE</h3>
        
        <div class="scroll-hint">
            사진 위에 스크롤을 통해 사진을 확인할 수 있습니다 <span style="font-style: normal;">👇</span>
        </div>

        <div class="record-scroll">
            
            <img th:src="${book.mainImageUrl}" class="content-img" alt="main-img">
            
            <div th:each="imgUrl : ${book.subImageUrls}">
                <img th:src="${imgUrl}" class="content-img" alt="sub-img">
            </div>

            <div th:if="${book.mainImageUrl == null and #lists.isEmpty(book.subImageUrls)}" class="text-center text-muted mt-5" style="font-style: italic;">
                "시각적인 기록이 없는 페이지로군..."
            </div>
            
        </div>
    </div>

    <div class="cover-wrapper">
        <div class="cover-front">
            <div style="border: 1px solid var(--jojo-gold); padding: 20px; text-align: center; width: 85%; height: 85%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <p style="letter-spacing: 4px; font-size: 0.7rem; opacity: 0.7; margin-bottom: 10px;">READ THE DESTINY</p>
                <h1 style="font-size: clamp(1.8rem, 5vw, 3rem); text-shadow: 2px 2px 4px rgba(0,0,0,0.5); font-weight: bold; word-break: keep-all;" th:text="${book.title}">제목</h1>
                <div style="height: 2px; background: var(--jojo-gold); width: 40px; margin: 15px auto;"></div>
            </div>
        </div>

        <div class="page cover-back">
            <h3 class="fw-bold border-bottom pb-2 mb-3" style="color: #443e33; font-style: italic; border-color: var(--jojo-gold) !important;">TEXT CHRONICLE</h3>
            
            <div class="d-flex flex-column flex-grow-1 overflow-hidden">
                <h2 class="title-text fw-bold mb-2" th:text="${book.title}">책 제목</h2>
                
                <div class="text-muted small mb-3 pb-2 border-bottom" style="border-color: rgba(197, 160, 89, 0.3) !important;">
                    작성일: <span th:text="${#temporals.format(book.createdAt, 'yyyy-MM-dd HH:mm')}"></span> |
                    조회수: <span th:text="${book.viewCount}" class="fw-bold" style="color: var(--book-crimson);">0</span>
                </div>

                <div class="record-scroll content-text mb-3" th:text="${book.content}">
                    본문 내용이지 이말이야
                </div>
            </div>

            <div class="mt-auto pt-3 border-top d-flex gap-2" style="border-color: rgba(197, 160, 89, 0.5) !important;">
                <a href="/" class="jojo-btn" style="flex: 1; background: transparent; color: var(--ink-black);">목록으로</a>
                <a th:href="@{/edit/{id}(id=${book.id})}" class="jojo-btn" style="flex: 2;">수정하기</a>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 페이지 접속 시 찰@지게 열리는 마도서 애니메이션!
    window.onload = () => { setTimeout(() => { document.getElementById('jojoBook').classList.add('opened'); }, 600); };
</script>
</body>
</html>
